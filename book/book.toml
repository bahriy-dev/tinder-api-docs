[book]
title = "Tinder API Documentation: The Unofficial Handbook"
description = "Unofficial Tinder API documentation for 2026: authentication and X-Auth-Token, the /v3 SMS login flow, 59 endpoints with request and response formats, and reviews of Python, Node.js and C# client libraries."
authors = ["Bahri Yilmaz"]
language = "en"
src = "src"

[build]
build-dir = "../dist"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/bahriy-dev/tinder-api-docs"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/bahriy-dev/tinder-api-docs/edit/main/book/{path}"
site-url = "/tinder-api-docs/"
no-section-label = false

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true

[output.html.print]
enable = true
