name: Endpoint fix or addition
description: Report an outdated, wrong or missing endpoint detail
labels: ["endpoint"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Don't share** tokens, phone numbers, real profiles or messages. Mask values with `***` if needed.
  - type: input
    id: endpoint
    attributes:
      label: Endpoint
      placeholder: "POST /like/{user_id}"
    validations:
      required: true
  - type: input
    id: chapter
    attributes:
      label: Chapter
      placeholder: "Chapter 6: Interactions"
  - type: textarea
    id: change
    attributes:
      label: What should change?
      description: What does the book say now, and what is correct?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: A code line, document or commit link
    validations:
      required: true
