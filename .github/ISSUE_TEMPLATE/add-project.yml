name: Suggest a catalog project
description: Propose a project for Appendix A
labels: ["catalog"]
body:
  - type: input
    id: repo
    attributes:
      label: Repository URL
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Client library
        - API documentation
        - Authentication helper
        - AI / MCP
        - Unofficial app
        - Research / experiment
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it belongs here
      description: What does it do better or differently from what is listed?
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Checks
      options:
        - label: It doesn't create accounts, bypass paid features or expose other people's data.
          required: true
        - label: I am not the author, or I have said that I am.
